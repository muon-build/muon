name = "muon-main"
main = "worker.js"
compatibility_date = "2026-11-01"
routes = [{ pattern = "muon.build", custom_domain = true }]

[assets]
directory = "../../build/doc/website"
binding = "ASSETS"
run_worker_first = ["/releases"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "muon"
