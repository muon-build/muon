name: haiku

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  haiku:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: cpa.sh {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_image: haiku
            version: r1beta6
    steps:
      - name: checkout
        uses: actions/checkout@master

      - name: boot ${{ matrix.os_image }}
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: ${{ matrix.os_image }}
          version: ${{ matrix.version }}

      - name: install dependencies
        run: pkgman install -y curl_devel libarchive_devel nasm git

      - name: bootstrap
        run: |
          export CC=gcc
          ./bootstrap.sh build
          build/muon-bootstrap -v build build

      - name: test
        run: |
          cd build
          ./muon test -d dots -t 3
