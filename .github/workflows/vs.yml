name: vs

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  test:
    strategy:
      matrix:
        compiler:
          - {c: 'cl', cpp: 'cl'}
          - {c: 'clang-cl', cpp: 'clang-cl'}
          - {c: 'clang', cpp: 'clang++'}
    name: ${{ matrix.compiler.c }}
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: set env vars
        run: >
          echo CC=${{ matrix.compiler.c }} >> %GITHUB_ENV%
          && echo CXX=${{ matrix.compiler.cpp }} >> %GITHUB_ENV%
      - name: bootstrap
        run: >
          bootstrap.bat build
          && build\muon-bootstrap.exe -v setup -Dvsenv=true build
          && build\muon-bootstrap.exe -vC build devenv ./muon-bootstrap.exe -v samu
      - name: test
        run: >
          build\muon.exe -vC build devenv ./muon.exe test -R -t 2
      - name: deploy gate
        id: deploy_gate
        if: github.event_name == 'push' && github.ref_type == 'branch'
        shell: bash
        env:
            GIT_REF: refs/heads/${{ github.ref_name }}
        run: |
          if tools/ci/ref_is_release_branch.sh "$GIT_REF"; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          fi
      - name: deploy_deps
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: choco install rclone -y
      - name: deploy
        if: steps.deploy_gate.outputs.deploy == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          . "build/version.sh"
          exe_name="muon-$version-amd64-win.exe"
          mv build/muon.exe "build/$exe_name"
          tools/ci/deploy.sh "$version" "build/$exe_name"
