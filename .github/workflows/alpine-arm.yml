name: alpine-meson

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  alpine-arm:
    runs-on: ubuntu-24.04-arm
    environment: master
    steps:
    - uses: actions/checkout@v3
    - name: build
      run: |
        tools/ci/alpine.sh -c
    - name: deploy gate
      id: deploy_gate
      if: github.event_name == 'push' && github.ref_type == 'branch'
      shell: bash
      env:
          GIT_REF: refs/heads/${{ github.ref_name }}
      run: |
        if tools/ci/ref_is_release_branch.sh "$GIT_REF"; then
          echo deploy=true >> "$GITHUB_OUTPUT"
        fi
    - name: deploy_deps
      if: steps.deploy_gate.outputs.deploy == 'true'
      run: sudo apt-get install -y rclone
    - name: deploy
      if: steps.deploy_gate.outputs.deploy == 'true'
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        . "build-docker/version.sh"
        tools/ci/deploy.sh "$version" \
          "build-docker/muon-$version-aarch64-linux" \
          "build-docker/muon-$version-aarch64-linux-small"
