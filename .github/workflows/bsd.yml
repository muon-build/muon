name: BSD

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  BSD:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: cpa.sh {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_image: openbsd
            version: "7.9"
    steps:
      - name: checkout
        uses: actions/checkout@master

      - name: boot ${{ matrix.os_image }}
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: ${{ matrix.os_image }}
          version: ${{ matrix.version }}

      - name: install dependencies
        run: |
          case "${{ matrix.os_image }}" in
            openbsd)
              sudo pkg_add nasm git
              ;;
          esac

      - name: bootstrap
        run: |
          extra_args=
          case "${{ matrix.os_image }}" in
            openbsd)
              export CC=cc
              # OpenBSD's curl port only ships a static libcurl.a here,
              # and without -Dstatic=true muon's pkg-config queries omit
              # Libs.private, leaving openssl/ngtcp2/nghttp3 symbols
              # undefined at link time.
              extra_args=-Dlibcurl=disabled
              ;;
          esac
          ./bootstrap.sh build
          build/muon-bootstrap -v build $extra_args build

      - name: test
        run: |
          cd build
          ./muon test -d dots
